name: Linkmerce Online Hourly Autonomous Revenue & Promotion Cycle

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  hourly-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify Quality & Automated Test Suite
        run: |
          pytest tests/ -v

      - name: Execute Hourly Autonomous Revenue & Promotion Cycle
        run: |
          python seed_data.py
          python hourly_cycle.py
