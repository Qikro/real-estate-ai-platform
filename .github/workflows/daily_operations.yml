name: Daily Institutional Real Estate Operations

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST (Hyderabad Commercial Hours)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  daily-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify Quality & Test Suite
        run: |
          pytest tests/ -v

      - name: Execute Daily Operations Cycle
        run: |
          python seed_data.py
          python daily_cycle.py
